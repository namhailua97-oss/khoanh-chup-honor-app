plugins {
    id 'com.android.application'
}

android {
    namespace 'com.namhailua.khoanhchup'
    compileSdk 35

    defaultConfig {
        applicationId 'com.namhailua.khoanhchup'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '6.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
